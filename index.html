<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>七宗罪 vs 七美德</title>
<style>
  :root{
    --gold: #c3a362; --gold-light: #d4bc8c; --gold-dark: #826c39;
    --sin-bg: #1a1a19; --sin-bg-soft: #242422; --sin-text: #e8e2d5; --sin-text-soft: #a39b8d; --sin-text-mute: #6e685d; --sin-line: rgba(195,163,98,.15); --sin-accent: #c3a362;
    --virtue-bg: #f7f5f0; --virtue-bg-soft: #eeece5; --virtue-text: #2b2a27; --virtue-text-soft: #615d55; --virtue-text-mute: #a09a90; --virtue-line: rgba(130,108,57,.12); --virtue-accent: #826c39;
    --font-serif: "Songti SC", "SimSun", "STSong", serif; 
    --font-sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; 
    --font-number: "Times New Roman", "Songti SC", "STSong", serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; -webkit-font-smoothing:antialiased; }
  body{ font-family:var(--font-sans); background:#111; color:var(--sin-text); min-height:100vh; display:flex; justify-content:center; overflow-x: hidden;}
  .app{ width:100%; max-width:480px; min-height:100vh; display:flex; flex-direction:column; position:relative; overflow-x:hidden; background: var(--sin-bg); }
  .screen{ display:none; flex-direction:column; flex:1; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .screen.active{ display:flex; animation:fadeIn .4s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  @keyframes slideUp { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
  @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
  @keyframes tiltBeam { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
  @keyframes compensatePan { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(3deg); } 75% { transform: rotate(-3deg); } }
  @keyframes borderGlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 0; } 20% { opacity: 0.8; } 100% { transform: translateY(-100px) scale(0.5); opacity: 0; } }
  .btn{ width:100%; border:none; padding:18px; font-family:var(--font-serif); font-size:16px; font-weight:600; letter-spacing:.3em; cursor:pointer; transition:transform .15s, box-shadow .3s, background .3s; border-radius: 8px;}
  .btn:active{ transform:scale(.98); }
  .btn.dark{ background:transparent; color:var(--gold-light); border:1px solid var(--sin-accent); }
  .btn.dark:hover{ background: rgba(195,163,98,.08); box-shadow: 0 0 20px rgba(195,163,98,.15); }
  .btn.light{ background:var(--virtue-text); color:var(--virtue-bg); box-shadow: 0 6px 16px rgba(0,0,0,.15); }
  .btn.light:hover{ background:#1a1a18; }

  #auth{ padding:24px; background:radial-gradient(circle at center, #1c1c1a 0%, #0d0d0c 100%); align-items:center; justify-content:center; position:relative; overflow: hidden;}
  .auth-frame { position: absolute; top: 5%; bottom: 5%; left: 12px; right: 12px; pointer-events: none; z-index: 1; border-radius: 24px; border: 2px solid transparent; background: linear-gradient(135deg, #0d0d0c, #0d0d0c) padding-box, linear-gradient(90deg, rgba(195,163,98,.3), rgba(195,163,98,.8), rgba(195,163,98,.3)) border-box; background-size: 200% 200%; animation: borderGlow 4s linear infinite; box-shadow: 0 0 30px rgba(195,163,98,.1) inset; }
  .auth-frame::before { content: ''; position: absolute; inset: 8px; border: 1px solid rgba(195,163,98,.15); border-radius: 16px; }
  .auth-frame::after { content: ''; position: absolute; top: -2px; left: 50%; transform: translateX(-50%); width: 100px; height: 4px; background: linear-gradient(90deg, transparent, var(--gold-light), transparent); border-radius: 4px; box-shadow: 0 0 16px var(--gold-light); }
  .corner-deco { position: absolute; width: 18px; height: 18px; z-index: 2; pointer-events: none; }
  .c-tl { top: 12px; left: 12px; border-top: 2px solid var(--gold); border-left: 2px solid var(--gold); border-radius: 8px 0 0 0; }
  .c-tr { top: 12px; right: 12px; border-top: 2px solid var(--gold); border-right: 2px solid var(--gold); border-radius: 0 8px 0 0; }
  .c-bl { bottom: 12px; left: 12px; border-bottom: 2px solid var(--gold); border-left: 2px solid var(--gold); border-radius: 0 0 0 8px; }
  .c-br { bottom: 12px; right: 12px; border-bottom: 2px solid var(--gold); border-right: 2px solid var(--gold); border-radius: 0 0 8px 0; }
  .stars-bg { position: absolute; inset: 0; pointer-events: none; z-index: 0;}
  .star { position: absolute; background: #fff; border-radius: 50%; box-shadow: 0 0 6px #fff; animation: twinkle 3s infinite alternate; }
  .s1 { width: 2px; height: 2px; top: 20%; left: 15%; animation-delay: 0s; }
  .s2 { width: 3px; height: 3px; top: 30%; right: 20%; animation-delay: 1s; }
  .s3 { width: 1.5px; height: 1.5px; bottom: 25%; left: 25%; animation-delay: 2s; }
  .s4 { width: 2px; height: 2px; bottom: 15%; right: 30%; animation-delay: 0.5s; }
  .particle { position: absolute; background: var(--gold-light); border-radius: 50%; box-shadow: 0 0 10px var(--gold); animation: floatUp 5s infinite ease-in; opacity: 0; }
  .p1 { width: 3px; height: 3px; bottom: 10%; left: 20%; animation-delay: 0s; }
  .p2 { width: 2px; height: 2px; bottom: 30%; right: 25%; animation-delay: 2s; }
  .p3 { width: 4px; height: 4px; bottom: 5%; left: 70%; animation-delay: 1s; animation-duration: 7s; }
  .auth-rings { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; z-index: 1; }
  .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(195,163,98,.06); }
  .r1 { width: 240px; height: 240px; border-style: dashed; animation: spin 40s linear infinite; }
  .r2 { width: 340px; height: 340px; border: 1px solid rgba(195,163,98,.04); }
  .r3 { width: 440px; height: 440px; border: 1px solid rgba(195,163,98,.02); }
  .auth-visual { position: relative; width: 200px; height: 160px; margin-bottom: 24px; display: flex; align-items: center; justify-content: center; z-index: 2;}
  .balance-scale { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 10px rgba(195,163,98,0.2));}
  .scale-stroke { stroke: var(--gold); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round;}
  .scale-fill { fill: var(--gold); }
  .scale-shadow { fill: rgba(195,163,98,0.1); stroke: none; }
  
  .auth-title{ font-family:var(--font-sans); font-size:36px; font-weight:700; margin:0 0 16px; color:var(--sin-text); letter-spacing: 2px; z-index: 2; text-shadow: 0 4px 15px rgba(0,0,0,.8);}
  /* 这里加了光效 */
  .auth-title .vs{ 
    font-family:var(--font-serif); 
    font-size:24px; 
    color:var(--gold-light); 
    margin:0 12px; 
    font-weight:400; 
    font-style:italic; 
    letter-spacing:0;
    text-shadow: 0 0 12px var(--gold-light), 0 0 20px var(--gold);
    display: inline-block;
  }

  .auth-sub{ font-family:var(--font-sans); font-size:13px; color:var(--sin-text-soft); margin:0 0 32px; letter-spacing:.2em; z-index: 2;}
  .auth-form{ width:100%; max-width:280px; z-index:10;}
  .code-input{ width:100%; height:56px; background:rgba(255,255,255,.03); border:1px solid var(--sin-line); border-radius:8px; text-align:center; font-family:var(--font-number); font-size:24px; letter-spacing:.8em; color:var(--sin-text); outline:none; padding-left:.8em; transition: all .3s; }
  .code-input:focus{ border-color:var(--gold); box-shadow: 0 0 20px rgba(195,163,98,.2); background:rgba(255,255,255,.05); }
  .code-input::placeholder{ color:var(--sin-text-mute); letter-spacing:.2em; font-size:16px; font-family:var(--font-sans); }
  .auth-error{ color:#d96359; font-size:13px; text-align:center; margin:12px 0 0; opacity:0; transition:.2s; height:14px; }
  .auth-error.show{ opacity:1; }

  #intro{ background:var(--sin-bg); }
  .side-sin, .side-virtue{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:28px 20px; position:relative; }
  .side-sin{ background:linear-gradient(180deg, var(--sin-bg) 0%, var(--sin-bg-soft) 100%); }
  .side-virtue{ background:linear-gradient(180deg, var(--virtue-bg-soft) 0%, var(--virtue-bg) 100%); }
  .side-sin::before, .side-virtue::before { content: ''; position: absolute; width: 250px; height: 250px; border-radius: 50%; filter: blur(70px); opacity: .6; z-index: 0; }
  .side-sin::before { background: rgba(195,163,98,.12); top: 10%; left: -20%; }
  .side-virtue::before { background: rgba(130,108,57,.1); bottom: 10%; right: -20%; }
  .intro-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
  .intro-icon{ width:44px; height:44px; stroke-width:1.2; fill:none; margin-bottom:12px; }
  .side-sin .intro-icon{ stroke:var(--gold-light); }
  .side-virtue .intro-icon{ stroke:var(--gold-dark); }
  .side-title-en{ font-family:var(--font-number); font-size:12px; letter-spacing:.5em; margin-bottom:8px; font-weight:500;}
  .side-sin .side-title-en{ color:var(--sin-text-mute); }
  .side-virtue .side-title-en{ color:var(--virtue-text-mute); }
  .side-title-cn{ font-family:var(--font-serif); font-size:38px; font-weight:700; letter-spacing:.2em; margin:0 0 16px; }
  .side-sin .side-title-cn{ color:var(--sin-text); text-shadow: 0 4px 20px rgba(195,163,98,.2);}
  .side-virtue .side-title-cn{ color:var(--virtue-text); text-shadow: 0 4px 20px rgba(0,0,0,.05);}
  .side-rule{ width:36px; height:2px; margin:0 auto 16px; position:relative; }
  .side-sin .side-rule{ background:var(--sin-accent); }
  .side-virtue .side-rule{ background:var(--virtue-accent); }
  .side-rule::after{ content:""; position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; transform:rotate(45deg); }
  .side-sin .side-rule::after{ background:var(--sin-accent); }
  .side-virtue .side-rule::after{ background:var(--virtue-accent); }
  .side-desc{ font-size:14px; line-height:2.2; letter-spacing:.15em; margin:0; }
  .side-sin .side-desc{ color:var(--sin-text-soft); }
  .side-virtue .side-desc{ color:var(--virtue-text-soft); }
  .intro-divider{ height:40px; background:linear-gradient(180deg, var(--sin-bg-soft) 50%, var(--virtue-bg-soft) 50%); display:flex; align-items:center; justify-content:center; position:relative; z-index:2; }
  .intro-divider::before{ content:""; position:absolute; left:40px; right:40px; height:1px; top:50%; background:var(--gold); opacity:.3; }
  .divider-badge{ width:32px; height:32px; border-radius:50%; background:var(--sin-bg); border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; font-family:var(--font-serif); font-size:15px; color:var(--gold); position:relative; z-index:1; box-shadow: 0 0 15px rgba(195,163,98,.3); }
  .intro-foot{ background:var(--virtue-bg); padding:20px 24px 28px; border-top:1px solid var(--virtue-line); text-align:center; }
  .intro-foot .btn{ max-width:320px; margin:0 auto 12px; }

  #quiz{ background:var(--sin-bg); transition:background .4s; padding-bottom:20px; }
  .quiz-top{ display:flex; justify-content:space-between; padding:16px 20px; font-size:13px; border-bottom:1px solid var(--sin-line); transition:border-color .4s; }
  .quiz-top .phase{ color:var(--sin-accent); display:flex; align-items:center; gap:6px; font-weight: 500; letter-spacing: 2px;}
  .quiz-top .phase::before{ content:''; width:6px; height:6px; background:currentColor; border-radius:50%; box-shadow: 0 0 8px currentColor; }
  .quiz-top .count{ color:var(--sin-text-mute); font-family:var(--font-number); font-size: 14px; }
  .progress-track{ height:3px; background:var(--sin-bg-soft); }
  .progress-fill{ height:100%; width:0; background:var(--sin-accent); transition:width .4s, background .4s; box-shadow: 0 0 10px var(--sin-accent); }
  .quiz-body{ flex:1; padding:28px 20px; display:flex; flex-direction:column; }
  .q-head{ display:flex; align-items:center; gap:12px; margin-bottom:24px; }
  .q-head .num{ font-family:var(--font-number); font-size:28px; color:var(--sin-accent); font-weight: bold;}
  .q-head .rule{ flex:1; height:1px; background:linear-gradient(90deg, var(--sin-line), transparent); }
  .q-head .label{ font-family:var(--font-number); font-size:11px; color:var(--sin-text-mute); letter-spacing:.3em; }
  .qtext{ font-family:var(--font-serif); font-size:22px; line-height:1.7; font-weight:500; color:var(--sin-text); margin:0 0 auto; letter-spacing: .5px; }
  .options{ display:flex; flex-direction:column; gap:12px; margin-top:40px; }
  .option{ display:flex; align-items:center; gap:16px; padding:16px 20px; background:rgba(255,255,255,.02); border:1px solid var(--sin-line); border-radius:10px; color:var(--sin-text-soft); font-size:15px; cursor:pointer; transition:all .2s; text-align:left; position: relative; overflow: hidden; letter-spacing: 1px;}
  .option::after { content:''; position: absolute; left:0; top:0; bottom:0; width:0; background:var(--sin-accent); opacity: 0; transition: all .3s; }
  .option .mark{ width:22px; height:22px; flex-shrink:0; z-index: 1;}
  .option .mark svg{ width:100%; height:100%; fill:none; stroke:var(--sin-text-mute); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; transition: stroke .3s;}
  .option span:last-child { z-index: 1; }
  .option.selected{ border-color:var(--sin-accent); background:rgba(195,163,98,.08); color:var(--sin-text); box-shadow: 0 4px 15px -5px rgba(195,163,98,.2); }
  .option.selected::after { width: 4px; opacity: 1; }
  .option.selected .mark svg{ stroke:var(--sin-accent); }
  .back-btn { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 24px auto 8px; padding: 12px 24px; width: fit-content; background: transparent; border: 1px solid var(--sin-line); border-radius: 40px; color: var(--sin-text-soft); font-family: var(--font-sans); font-size: 14px; letter-spacing: 0.1em; cursor: pointer; transition: all 0.2s ease; opacity: 0.7; }
  .back-btn:hover { opacity: 1; border-color: var(--sin-accent); color: var(--sin-accent); }
  .back-btn:active { transform: scale(0.96); }
  .back-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; }
  #quiz.theme-virtue .back-btn { border-color: var(--virtue-line); color: var(--virtue-text-soft); }
  #quiz.theme-virtue .back-btn:hover { border-color: var(--virtue-accent); color: var(--virtue-accent); }
  #quiz.theme-virtue{ background:var(--virtue-bg); }
  #quiz.theme-virtue .quiz-top{ border-color:var(--virtue-line); }
  #quiz.theme-virtue .quiz-top .phase{ color:var(--virtue-accent); }
  #quiz.theme-virtue .quiz-top .count{ color:var(--virtue-text-mute); }
  #quiz.theme-virtue .progress-track{ background:var(--virtue-bg-soft); }
  #quiz.theme-virtue .progress-fill{ background:var(--virtue-accent); box-shadow: 0 0 10px var(--virtue-accent); }
  #quiz.theme-virtue .q-head .num{ color:var(--virtue-accent); }
  #quiz.theme-virtue .q-head .label{ color:var(--virtue-text-mute); }
  #quiz.theme-virtue .qtext{ color:var(--virtue-text); }
  #quiz.theme-virtue .option{ background:rgba(0,0,0,.02); border-color:var(--virtue-line); color:var(--virtue-text-soft); }
  #quiz.theme-virtue .option::after { background: var(--virtue-accent); }
  #quiz.theme-virtue .option.selected{ border-color:var(--virtue-accent); background:rgba(130,108,57,.05); color:var(--virtue-text); box-shadow: 0 4px 15px -5px rgba(130,108,57,.2); }
  #quiz.theme-virtue .option.selected .mark svg{ stroke:var(--virtue-accent); }

  #result{ background:var(--virtue-bg); overflow-y:auto; }
  .res-inner{ padding:24px 20px 40px; max-width: 480px; margin: 0 auto; }
  .res-header{ text-align:center; margin-bottom:24px; }
  .res-title{ font-family:var(--font-serif); font-size:22px; font-weight:700; color:var(--virtue-text); margin:0 0 24px; letter-spacing: 1px;}
  .res-title .hl{ color:var(--virtue-accent); }
  .res-dual{ display:flex; gap:16px; }
  .res-card{ flex:1; padding:24px 16px; border-radius:16px; text-align:center; animation: slideUp .5s ease both;}
  .res-card.sin{ background:var(--sin-bg); color:var(--sin-text); border:1px solid var(--sin-line); box-shadow: 0 8px 24px rgba(0,0,0,.15); animation-delay: 0.1s;}
  .res-card.virtue{ background:#fff; color:var(--virtue-text); border:1px solid var(--virtue-line); box-shadow: 0 8px 24px rgba(0,0,0,.06); animation-delay: 0.2s;}
  .res-card-label{ font-size:13px; opacity:.7; margin-bottom:12px; letter-spacing: 2px;}
  .res-card-name{ font-family:var(--font-serif); font-size:32px; font-weight:700; margin:0 0 8px; letter-spacing: 2px;}
  .res-card-name.sin-name{ color:var(--sin-accent); text-shadow: 0 0 24px rgba(195,163,98,.4); }
  .res-card-name.virtue-name{ color:var(--virtue-accent); }
  .res-card-pct{ font-family:var(--font-number); font-size:16px; opacity:.9;}

  .summary-text { text-align:left; background: #e8e2d5; color: #6b5734; padding: 16px 20px; border-radius: 12px; font-size: 14px; margin: 0 auto 24px; width: 100%; line-height: 1.8; font-family: var(--font-serif); position: relative; border-left: 5px solid var(--gold-dark); animation: slideUp .5s ease both; animation-delay: 0.3s; letter-spacing: .5px; }

  .merged-wrap{ background:#fff; border-radius:16px; padding:28px 20px; margin-bottom:24px; border:1px solid var(--virtue-line); text-align:center; box-shadow: 0 6px 24px rgba(0,0,0,.04); animation: slideUp .5s ease both; animation-delay: 0.4s;}
  .merged-title{ font-family:var(--font-serif); font-size:18px; font-weight:700; margin-bottom:6px; color: var(--virtue-text); letter-spacing: 1px;}
  .merged-subtitle { font-size:13px; color:#888; margin-bottom:20px; }
  .radar-wrap{ width:100%; max-width:320px; margin:0 auto; }
  .radar-wrap svg{ width:100%; height:auto; display:block; overflow:visible; }

  .block{ border-radius:16px; margin-bottom:24px; overflow:hidden; box-shadow: 0 4px 16px rgba(0,0,0,.04);}
  .block.sin-block{ background:var(--sin-bg); border:1px solid var(--sin-line); color:var(--sin-text); }
  .block.virtue-block{ background:#fff; border:1px solid var(--virtue-line); color:var(--virtue-text); }
  .block-head{ display:flex; justify-content:space-between; align-items:center; padding:20px; border-bottom:1px solid; }
  .sin-block .block-head{ border-color:var(--sin-line); }
  .virtue-block .block-head{ border-color:var(--virtue-line); }
  .block-title{ font-family:var(--font-serif); font-size:17px; font-weight:700; margin:0; letter-spacing: 1px;}
  .save-btn{ background:none; border:1px solid; padding:6px 14px; border-radius:8px; font-size:12px; cursor:pointer; transition: all .2s; letter-spacing: 1px;}
  .save-btn:hover{ opacity: .8; }
  .sin-block .save-btn{ color:var(--sin-accent); border-color:var(--sin-accent); }
  .virtue-block .save-btn{ color:var(--virtue-accent); border-color:var(--virtue-accent); }
  .block-body{ padding:24px 20px; }

  .rank-row{ display:flex; align-items:center; margin-bottom:16px; }
  .rank-name{ width:52px; font-size:14px; flex-shrink: 0; letter-spacing: 1px;}
  .sin-block .rank-name{ color:var(--sin-text-soft); }
  .virtue-block .rank-name{ color:var(--virtue-text-soft); }
  .rank-track{ flex:1; height:6px; border-radius:3px; margin:0 14px; overflow:hidden; }
  .sin-block .rank-track{ background:rgba(255,255,255,.06); }
  .virtue-block .rank-track{ background:rgba(0,0,0,.06); }
  .rank-fill{ height:100%; width:0; transition:width 1s cubic-bezier(0.22, 1, 0.36, 1); }
  .sin-block .rank-fill{ background:var(--sin-accent); box-shadow: 0 0 8px var(--sin-accent); }
  .virtue-block .rank-fill{ background:var(--virtue-accent); box-shadow: 0 0 8px var(--virtue-accent); }
  .rank-val{ width:44px; font-family:var(--font-number); font-size:14px; text-align:right; flex-shrink: 0; }
  .sin-block .rank-val{ color:var(--sin-text-mute); }
  .virtue-block .rank-val{ color:var(--virtue-text-mute); }

  .insight-list{ margin-top:28px; padding-top:28px; border-top:1px dashed; }
  .sin-block .insight-list{ border-color:var(--sin-line); }
  .virtue-block .insight-list{ border-color:var(--virtue-line); }
  .insight-item{ margin-bottom:20px; }
  .insight-head{ display:flex; justify-content:space-between; margin-bottom:10px; font-size:15px; font-weight:600; font-family: var(--font-serif); padding:6px 10px; border-radius:6px; letter-spacing: 1px;}
  .sin-block .insight-head { background: rgba(195,163,98,.08); color: var(--sin-accent);}
  .virtue-block .insight-head { background: rgba(130,108,57,.06); color: var(--virtue-accent);}
  .insight-text{ font-size:14px; line-height:1.8; margin:0; opacity:.85; padding: 0 4px; letter-spacing: .5px;}

  .res-foot{ text-align:center; margin-top:36px; }

// 随机打乱与交叉逻辑
function shuffle(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex != 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

const sinQs = shuffle(RAW_QS.filter(q => SINS[q.d]));
const virtueQs = shuffle(RAW_QS.filter(q => VIRTUES[q.d]));
const QS = [];

// 每6题交叉
for (let i = 0; i < 21; i += 6) {
  QS.push(...sinQs.slice(i, Math.min(i + 6, 21)));
  QS.push(...virtueQs.slice(i, Math.min(i + 6, 21)));
}

const OPTIONS = [{ v:1, t:'完全不符合' }, { v:2, t:'不太符合' }, { v:3, t:'一般' }, { v:4, t:'比较符合' }, { v:5, t:'完全符合' }];
const TOTAL = QS.length;
let idx = 0, answers = Array(TOTAL).fill(0), locked = false;
let cSLists, cVLists;

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('#' + id).classList.add('active');
  window.scrollTo(0, 0);
}

$('#authBtn').onclick = () => {
  if ($('#codeInput').value.trim() === ACCESS_CODE) showScreen('intro');
  else { $('#authError').classList.add('show'); $('#codeInput').value = ''; }
};
$('#codeInput').oninput = () => $('#authError').classList.remove('show');

$('#startBtn').onclick = () => { 
  // 重新随机打乱并交叉
  const nSinQs = shuffle(RAW_QS.filter(q => SINS[q.d]));
  const nVirtueQs = shuffle(RAW_QS.filter(q => VIRTUES[q.d]));
  QS.length = 0;
  for (let i = 0; i < 21; i += 6) {
    QS.push(...nSinQs.slice(i, Math.min(i + 6, 21)));
    QS.push(...nVirtueQs.slice(i, Math.min(i + 6, 21)));
  }
  
  idx = 0; answers.fill(0); locked = false; showScreen('quiz'); renderQ(); 
};
$('#restart').onclick = () => showScreen('intro');

$('#backBtn').onclick = () => {
  if (idx > 0) {
    idx--;
    renderQ();
  } else {
    showScreen('intro');
  }
};

function renderQ() {
  if (idx >= TOTAL) return showResult();
  const q = QS[idx];
  const isSin = SINS[q.d] !== undefined;
  
  const quiz = $('#quiz');
  quiz.className = 'screen active ' + (isSin ? '' : 'theme-virtue');

  $('#quizPhase').textContent = isSin ? '七宗罪' : '七美德';
  $('#quizCount').textContent = `${String(idx+1).padStart(2,'0')} / ${TOTAL}`;
  $('#qNum').textContent = String(idx+1).padStart(2,'0');
  $('#qLabel').textContent = isSin ? 'SIN' : 'VIRTUE';
  $('#progressFill').style.width = ((idx + 1) / TOTAL * 100) + '%';
  $('#qText').textContent = q.q;

  const box = $('#options'); box.innerHTML = '';
  const svgStr = isSin 
    ? '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>' 
    : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="5" y1="5" x2="6.5" y2="6.5"/><line x1="17.5" y1="17.5" x2="19" y2="19"/><line x1="5" y1="19" x2="6.5" y2="17.5"/><line x1="17.5" y1="6.5" x2="19" y2="5"/></svg>';

  OPTIONS.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'option' + (answers[idx] === o.v ? ' selected' : '');
    btn.innerHTML = `<span class="mark">${svgStr}</span><span>${o.t}</span>`;
    btn.onclick = () => {
      if (locked) return; locked = true;
      answers[idx] = o.v;
      document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
      btn.classList.add('selected');
      setTimeout(() => { locked = false; idx++; renderQ(); }, 200);
    };
    box.appendChild(btn);
  });
  
  const backBtn = $('#backBtn');
  if (idx > 0) {
    backBtn.style.display = 'flex';
  } else {
    backBtn.style.display = 'flex';
  }
}

function showResult() {
  const sScores = {}, vScores = {};
  Object.keys(SINS).forEach(k => sScores[k] = 0);
  Object.keys(VIRTUES).forEach(k => vScores[k] = 0);
  
  QS.forEach((q, i) => {
    if (SINS[q.d]) sScores[q.d] += answers[i];
    else vScores[q.d] += answers[i];
  });

  const sList = Object.keys(SINS).map(k => ({ key:k, ...SINS[k], pct: Math.round((sScores[k]-3)/12*100) })).sort((a,b)=>b.pct-a.pct);
  const vList = Object.keys(VIRTUES).map(k => ({ key:k, ...VIRTUES[k], pct: Math.round((vScores[k]-3)/12*100) })).sort((a,b)=>b.pct-a.pct);

  cSLists = sList; cVLists = vList;

  $('#topSinName').textContent = sList[0].n;
  $('#topSinPct').textContent = sList[0].pct + '%';
  $('#topVirtueName').textContent = vList[0].n;
  $('#topVirtuePct').textContent = vList[0].pct + '%';
  
  $('#summaryText').textContent = generateSummary(sList[0], vList[0], sList, vList);

  const renderList = (list, container) => {
    container.innerHTML = list.map((it, i) => `
      <div class="rank-row${i===0?' top':''}">
        <span class="rank-name">${it.n}</span>
        <div class="rank-track"><div class="rank-fill" data-w="${it.pct}"></div></div>
        <span class="rank-val">${it.pct}%</span>
      </div>
    `).join('');
  };
  renderList(sList, $('#sinRankList'));
  renderList(vList, $('#virtueRankList'));

  const renderInsights = (list, container) => {
    container.innerHTML = list.map(it => {
      let desc = it.tMid;
      if (it.pct <= 25) desc = it.tLow;
      else if (it.pct >= 75) desc = it.tHigh;
      
      return `
      <div class="insight-item">
        <div class="insight-head"><span>${it.n}</span><span>${it.pct}%</span></div>
        <p class="insight-text">${desc}</p>
      </div>
    `}).join('');
  };
  renderInsights(sList, $('#sinInsightList'));
  renderInsights(vList, $('#virtueInsightList'));

  renderSingleRadar('#sinRadar', sList, '#c3a362', '#22221f');
  renderSingleRadar('#virtueRadar', vList, '#826c39', '#f4f2eb');
  renderMergedRadar();

  showScreen('result');
  
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.querySelectorAll('.rank-fill').forEach(el => {
        el.style.width = el.dataset.w + '%';
      });
    });
  });
}

function renderSingleRadar(sel, list, color, bg) {

  }
  for(let i=0;i<n;i++){
    let a=-Math.PI/2+i*step;
    const line=document.createElementNS(ns,'line'); line.setAttribute('x1',cx); line.setAttribute('y1',cy); line.setAttribute('x2',cx+Math.cos(a)*maxR); line.setAttribute('y2',cy+Math.sin(a)*maxR); line.setAttribute('stroke',color); line.setAttribute('stroke-opacity','.25'); svg.appendChild(line);
  }
  
  let pts='';
  list.forEach((it,i)=>{ let a=-Math.PI/2+i*step, r=Math.max((it.pct/100)*maxR, 4); pts+=(i===0?'':' ')+(cx+Math.cos(a)*r)+','+(cy+Math.sin(a)*r); });
  const poly=document.createElementNS(ns,'polygon'); poly.setAttribute('points',pts); poly.setAttribute('fill',color); poly.setAttribute('fill-opacity','.15'); poly.setAttribute('stroke',color); poly.setAttribute('stroke-width','2'); svg.appendChild(poly);

  list.forEach((it,i)=>{
    let a=-Math.PI/2+i*step, r=Math.max((it.pct/100)*maxR, 4), x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
    const c=document.createElementNS(ns,'circle'); c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r','3.5'); c.setAttribute('fill',bg); c.setAttribute('stroke',color); c.setAttribute('stroke-width','1.5'); svg.appendChild(c);
    
    let lr=maxR+28, lx=cx+Math.cos(a)*lr, ly=cy+Math.sin(a)*lr;
    const t=document.createElementNS(ns,'text'); t.setAttribute('x',lx); t.setAttribute('y',ly); t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','middle'); t.setAttribute('font-size','12'); t.setAttribute('font-weight','bold'); t.setAttribute('fill',color); t.setAttribute('font-family','sans-serif'); t.textContent=it.n; svg.appendChild(t);
  });
}

function renderMergedRadar() {
  const svg = $('#mergedRadar');
  const cx=170, cy=160, maxR=90, n=14, step=Math.PI*2/n;
  svg.innerHTML=''; const ns='http://www.w3.org/2000/svg';
  
  const sMap={}, vMap={};
  cSLists.forEach(x=>sMap[x.key]=x); cVLists.forEach(x=>vMap[x.key]=x);
  
  const sOrder=['pride', 'greed', 'lust', 'envy', 'wrath', 'gluttony', 'sloth'];
  const vOrder=['humility', 'charity', 'chastity', 'kindness', 'patience', 'temperance', 'diligence'];
  
  const data = [];
  sOrder.forEach((k,i)=>data.push({ val:sMap[k].pct, type:'s', ang:-Math.PI/2 - i*step, name:sMap[k].n }));
  vOrder.forEach((k,i)=>data.push({ val:vMap[k].pct, type:'v', ang:-Math.PI/2 - (i+7)*step, name:vMap[k].n }));

  for(let l=1;l<=5;l++){
    let d='', r=maxR/5*l;
    for(let i=0;i<n;i++){ let a=-Math.PI/2+i*step; d+=(i===0?'M':'L')+(cx+Math.cos(a)*r)+','+(cy+Math.sin(a)*r); }
    const p=document.createElementNS(ns,'path'); p.setAttribute('d',d+'Z'); p.setAttribute('fill','none'); p.setAttribute('stroke','#dcd8ce'); p.setAttribute('stroke-width','1'); svg.appendChild(p);
  }
  for(let i=0;i<n;i++){ let a=-Math.PI/2+i*step; const line=document.createElementNS(ns,'line'); line.setAttribute('x1',cx); line.setAttribute('y1',cy); line.setAttribute('x2',cx+Math.cos(a)*maxR); line.setAttribute('y2',cy+Math.sin(a)*maxR); line.setAttribute('stroke','#e8e5dc'); svg.appendChild(line); }

  let sPts = '';
  data.slice(0,7).forEach((d,i)=>{ let r=Math.max((d.val/100)*maxR, 4); sPts+=(i===0?'':' ')+(cx+Math.cos(d.ang)*r)+','+(cy+Math.sin(d.ang)*r); });
  sPts += ` ${cx},${cy}`;
  const sPoly=document.createElementNS(ns,'polygon'); sPoly.setAttribute('points',sPts); sPoly.setAttribute('fill','#b0ada6'); sPoly.setAttribute('fill-opacity','.4'); sPoly.setAttribute('stroke','#555'); sPoly.setAttribute('stroke-width','2'); svg.appendChild(sPoly);

  let vPts = '';
  data.slice(7).forEach((d,i)=>{ let r=Math.max((d.val/100)*maxR, 4); vPts+=(i===0?'':' ')+(cx+Math.cos(d.ang)*r)+','+(cy+Math.sin(d.ang)*r); });
  vPts += ` ${cx},${cy}`;
  const vPoly=document.createElementNS(ns,'polygon'); vPoly.setAttribute('points',vPts); vPoly.setAttribute('fill','#c3a362'); vPoly.setAttribute('fill-opacity','.4'); vPoly.setAttribute('stroke','#826c39'); vPoly.setAttribute('stroke-width','2'); svg.appendChild(vPoly);

  data.forEach((d,i)=>{
    let lr=maxR+32, lx=cx+Math.cos(d.ang)*lr, ly=cy+Math.sin(d.ang)*lr;
    let anchor='middle';
    if(Math.cos(d.ang)>0.1) anchor='start'; else if(Math.cos(d.ang)<-0.1) anchor='end';
    
    const textColor = d.type === 's' ? '#333' : '#826c39';
    const scoreColor = d.type === 's' ? '#666' : '#826c39';

    const t=document.createElementNS(ns,'text'); t.setAttribute('x',lx); t.setAttribute('y',ly); t.setAttribute('text-anchor',anchor); t.setAttribute('dominant-baseline','middle'); t.setAttribute('font-size','12'); t.setAttribute('font-weight','bold'); t.setAttribute('fill',textColor); t.setAttribute('font-family','sans-serif'); t.textContent = d.name; svg.appendChild(t);

    const scoreT=document.createElementNS(ns,'text'); scoreT.setAttribute('x',lx); scoreT.setAttribute('y',ly + (ly<cy?-16:16)); scoreT.setAttribute('text-anchor',anchor); scoreT.setAttribute('dominant-baseline','middle'); scoreT.setAttribute('font-size','11'); scoreT.setAttribute('font-family','sans-serif'); scoreT.setAttribute('fill',scoreColor); scoreT.textContent = d.val + '%'; svg.appendChild(scoreT);
  });
}

window.saveMergedImage = async function(btn) {
  const orig = btn.textContent; btn.textContent = '生成中…'; btn.disabled = true;
  await new Promise(r => setTimeout(r, 100));
  
  const cvs = document.createElement('canvas'), W=400, H=480;
  cvs.width=W*2; cvs.height=H*2;
  const ctx = cvs.getContext('2d'); ctx.scale(2,2);
  
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#1a1a1a'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('十四维人格全貌', W/2, 40);
  
  ctx.fillStyle = '#888'; ctx.font = '12px sans-serif';
  ctx.fillText('左侧为七宗罪，右侧为七美德', W/2, 75);

  const cx=W/2, cy=260, maxR=90, n=14, step=Math.PI*2/n;
  const sMap={}, vMap={}; cSLists.forEach(x=>sMap[x.key]=x); cVLists.forEach(x=>vMap[x.key]=x);
  
  const sOrder=['pride', 'greed', 'lust', 'envy', 'wrath', 'gluttony', 'sloth'];
  const vOrder=['humility', 'charity', 'chastity', 'kindness', 'patience', 'temperance', 'diligence'];
  
  const data = [];
  sOrder.forEach((k,i)=>data.push({ val:sMap[k].pct, type:'s', ang:-Math.PI/2 - i*step, name:sMap[k].n }));
  vOrder.forEach((k,i)=>data.push({ val:vMap[k].pct, type:'v', ang:-Math.PI/2 - (i+7)*step, name:vMap[k].n }));

  ctx.strokeStyle = '#dcd8ce'; ctx.lineWidth = 1;
  for(let l=1;l<=5;l++){
    let d='', r=maxR/5*l;
    for(let i=0;i<n;i++){ let a=-Math.PI/2+i*step; d+=(i===0?'M':'L')+(cx+Math.cos(a)*r)+','+(cy+Math.sin(a)*r); }
    ctx.stroke(new Path2D(d+'Z'));
  }
  for(let i=0;i<n;i++){ let a=-Math.PI/2+i*step; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*maxR, cy+Math.sin(a)*maxR); ctx.strokeStyle='#e8e5dc'; ctx.stroke(); }

  ctx.beginPath();
  ctx.moveTo(cx, cy);
  data.slice(0,7).forEach((d)=>{ let r=Math.max((d.val/100)*maxR, 4); ctx.lineTo(cx+Math.cos(d.ang)*r, cy+Math.sin(d.ang)*r); });
  ctx.closePath();
  ctx.fillStyle='#e8e8e8'; ctx.strokeStyle='#555'; ctx.lineWidth=2; ctx.fill(); ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx, cy);
  data.slice(7).forEach((d)=>{ let r=Math.max((d.val/100)*maxR, 4); ctx.lineTo(cx+Math.cos(d.ang)*r, cy+Math.sin(d.ang)*r); });
  ctx.closePath();
  ctx.fillStyle='#f4e8d3'; ctx.strokeStyle='#826c39'; ctx.lineWidth=2; ctx.fill(); ctx.stroke();

  ctx.textBaseline = 'middle';
  data.forEach((d)=>{
    let lr=maxR+28, lx=cx+Math.cos(d.ang)*lr, ly=cy+Math.sin(d.ang)*lr;
    
    ctx.textAlign = 'center';
    if (Math.cos(d.ang) > 0.1) { ctx.textAlign = 'left'; lx += 2; } 
    else if (Math.cos(d.ang) < -0.1) { ctx.textAlign = 'right'; lx -= 2; }

    ctx.fillStyle = d.type==='s'?'#333':'#826c39'; ctx.font = 'bold 13px sans-serif'; 
    ctx.fillText(d.name, lx, ly - 10);
    ctx.fillStyle = d.type==='s'?'#666':'#826c39'; ctx.font = '12px "Times New Roman", "Songti SC", "STSong", serif'; 
    ctx.fillText(d.val + '%', lx, ly + 10);
  });

  $('#previewImg').src = cvs.toDataURL('image/png');
  $('#previewMask').classList.add('show');
  btn.textContent = orig; btn.disabled = false;
};

window.saveImage = async function(type, btn) {
  const orig = btn.textContent; btn.textContent = '生成中…'; btn.disabled = true;
  await new Promise(r => setTimeout(r, 100));

  const isSin = type === 'sin';
  const listData = isSin ? cSLists : cVLists;
  const bg = isSin ? '#22221f' : '#f4f2eb';
  const textColor = isSin ? '#dfd8cb' : '#33312d';
  const accentColor = isSin ? '#c3a362' : '#826c39';

  const cvs = document.createElement('canvas'), W=400, H=660; 
  cvs.width=W*2; cvs.height=H*2;
  const ctx = cvs.getContext('2d'); ctx.scale(2,2);
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  
  ctx.fillStyle = accentColor; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline='top';
  ctx.fillText(isSin ? '七宗罪倾向报告' : '七美德倾向报告', W/2, 35);
  
  const cx=W/2, cy=190, maxR=65, n=7, step=Math.PI*2/n;
  ctx.strokeStyle = accentColor; ctx.lineWidth = 1;
  for(let l=1;l<=5;l++){
    let d='', r=maxR/5*l;
    for(let i=0;i<n;i++){ let a=-Math.PI/2+i*step; d+=(i===0?'M':'L')+(cx+Math.cos(a)*r)+','+(cy+Math.sin(a)*r); }
    ctx.beginPath(); ctx.globalAlpha = l===5?0.4:0.2; ctx.strokeStyle=accentColor; ctx.stroke(new Path2D(d+'Z'));
  }
  ctx.globalAlpha = 1;
  for(let i=0;i<n;i++){ let a=-Math.PI/2+i*step; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*maxR, cy+Math.sin(a)*maxR); ctx.globalAlpha=0.25; ctx.strokeStyle=accentColor; ctx.stroke(); }
  ctx.globalAlpha = 1;
  
  ctx.beginPath();
  listData.forEach((it,i)=>{ 
    let a=-Math.PI/2+i*step, r=Math.max((it.pct/100)*maxR, 4); 
    let x = cx+Math.cos(a)*r, y = cy+Math.sin(a)*r;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); 
  });
  ctx.closePath(); 
  ctx.fillStyle=accentColor; ctx.globalAlpha=0.15; ctx.fill(); ctx.globalAlpha=0.8; ctx.stroke(); ctx.globalAlpha=1;
  
  ctx.textBaseline = 'middle';
  listData.forEach((it,i)=>{ 
    let a=-Math.PI/2+i*step, lr=maxR+24, lx=cx+Math.cos(a)*lr, ly=cy+Math.sin(a)*lr;
    
    ctx.textAlign = 'center'; 
    ctx.fillStyle = textColor; ctx.font = 'bold 12px sans-serif';
    ctx.fillText(it.n, lx, ly-8);
    
    ctx.fillStyle = accentColor; ctx.font = '12px "Times New Roman", "Songti SC", "STSong", serif'; 
    ctx.fillText(it.pct + '%', lx, ly+10);
  });

  let y = 300, px = 40, bw = W-80-60;
  ctx.textBaseline = 'top';
  listData.forEach(it => {
    ctx.textAlign='left'; ctx.fillStyle=accentColor; ctx.font='bold 14px sans-serif'; ctx.fillText(it.n, px, y - 8);
    
    ctx.font='14px "Times New Roman", "Songti SC", "STSong", serif';
    let pctStr = it.pct + '%';
    let textWidth = ctx.measureText(pctStr).width;
    
    ctx.textAlign='left'; 
    ctx.fillText(pctStr, W - px - textWidth, y + 6);
    
    y += 18;
    ctx.fillStyle=isSin?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.08)'; 
    ctx.beginPath(); ctx.roundRect(px, y, bw, 6, 3); ctx.fill();
    
    ctx.fillStyle=accentColor; 
    ctx.beginPath(); ctx.roundRect(px, y, Math.max(bw*(it.pct/100),6), 6, 3); ctx.fill();
    
    y += 32;
  });

  $('#previewImg').src = cvs.toDataURL('image/png');
  $('#previewMask').classList.add('show');
  btn.textContent = orig; btn.disabled = false;
};

$('#previewClose').onclick = () => $('#previewMask').classList.remove('show');
</script>
